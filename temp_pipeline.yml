name: USA Military & Army Video Pipeline (Daily Peak Hours)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *' # 9:00 AM EST
    - cron: '0 18 * * *' # 1:00 PM EST
    - cron: '0 22 * * *' # 5:00 PM EST
    - cron: '0 1 * * *'  # 8:00 PM EST
    - cron: '0 4 * * *'  # 11:00 PM EST

permissions:
  contents: write

concurrency:
  group: daily-military-pipeline
  cancel-in-progress: true

jobs:
  process_video:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_MILITARY }}
      TIKTOK_AUTH_STATE: ${{ secrets.TIKTOK_AUTH_STATE }}
      TIKTOK_AUTH_STATE_B64: ${{ secrets.TIKTOK_AUTH_STATE_B64 }}
      X_PROFILES: ${{ secrets.X_PROFILES }}
      TWITTER_PROFILES: ${{ secrets.X_PROFILES }}
      X_BACKUP_PROFILES: ${{ secrets.X_BACKUP_PROFILES }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run Pipeline (Download -> Edit -> Upload)
        run: python main_agent.py

      - name: Run Unified Reporter
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_MILITARY }}
        run: python src/agent_4_reporter.py

      - name: Commit updated files
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add downloaded_history.txt || true
          git add daily_limits.json || true
          git add -f tiktok_error.png || true
          git commit -m "Update download history (daily peak) [skip ci]" || true
          git pull origin main --rebase --strategy-option=ours || true
          git push origin HEAD:main || true
